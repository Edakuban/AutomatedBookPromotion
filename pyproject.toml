[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "automated-book-promotion"
version = "0.1.0"
description = "Lokale Verwaltung und KI-Analyse eigener Buecher fuer automatisierte Promotion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1.6,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pillow>=11,<13",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
    "tzdata>=2025.1",
]

[project.scripts]
bookpromo = "bookpromo.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/bookpromo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
